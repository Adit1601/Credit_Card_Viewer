org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AGP 8.7's bundled lint uses IntelliJ code that can't parse JDK 26's version string
# ("IllegalArgumentException: 25.0.2" from JavaVersion.parse). Pin the build to JDK 17,
# Google's officially supported build JDK for AGP 8.x. Runtime targets are unchanged.
org.gradle.java.home=/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false

kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
